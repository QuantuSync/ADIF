services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adif}
      POSTGRES_DB: ${POSTGRES_DB:-adif}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adif} -d ${POSTGRES_DB:-adif}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./engine
    # `esperar_bd` antes de migrar/arrancar (sesión de tolerancia a
    # reinicios de dockerd, 2026-09-06): `depends_on: condition:
    # service_healthy` de abajo solo lo respeta `docker compose up` -- un
    # reinicio de dockerd que restaura los contenedores con
    # `restart: unless-stopped` los arranca cada uno por su cuenta, sin ese
    # orden. Ver docstring de app/esperar_bd.py.
    command: sh -c "python -m app.esperar_bd && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adif}:${POSTGRES_PASSWORD:-adif}@postgres:5432/${POSTGRES_DB:-adif}
      DOCUMENT_STORAGE_PATH: /data/documentos
      # Cruce con el Excel de códigos (CONTEXTO.md sección 7). Vacío por
      # defecto: sin esta variable, ningún expediente cruza (se deja vacío
      # y se marca, nunca se inventa). Para activarlo en local, añade un
      # docker-compose.override.yml que monte tu `Expedientes.xlsx` en esta
      # ruta y define CODIGOS_PROYECTO_PATH=/data/codigos_proyecto.xlsx.
      CODIGOS_PROYECTO_PATH: ${CODIGOS_PROYECTO_PATH:-}
      # Bloque 1, sesión del Excel de ejecución SAP (2026-09-07): mismo
      # mecanismo que CODIGOS_PROYECTO_PATH de arriba, para el estado de
      # contrato SAP (app.extraccion.estado_sap). Solo lo lee la API
      # (POST /mantenimiento/estado-sap/cargar), el worker no la necesita.
      ESTADO_SAP_PATH: ${ESTADO_SAP_PATH:-}
      # Bloque 6, cambios del cliente tras revisar el catálogo: desglose de
      # SAP con las matrículas concretas de cada contrato
      # (app.extraccion.sap_desglose) -- mismo mecanismo que las dos rutas
      # de arriba. Solo lo lee la API (POST /mantenimiento/sap-desglose/cargar).
      SAP_DESGLOSE_PATH: ${SAP_DESGLOSE_PATH:-}
      # Bloque 1, sesión 2026-09-10: maestro de materiales de SAP
      # (app.extraccion.maestro_materiales) -- mismo mecanismo que las dos
      # rutas de arriba. Solo lo lee la API (POST
      # /mantenimiento/maestro-materiales/cargar).
      MAESTRO_MATERIALES_PATH: ${MAESTRO_MATERIALES_PATH:-}
      # Bloque 5, cambios del cliente tras revisar el catálogo: lista de
      # exclusión de expedientes (app/exclusion.py), un fichero de texto
      # plano -- una entrada por línea, código exacto ("6.24/28510.0088")
      # o departamento completo ("28520"), "#" para comentarios -- que
      # ADIF puede editar sin tocar código ni pedir un despliegue. Solo la
      # API la lee (GET /catalogo y el Excel, los dos únicos sitios de los
      # que el cliente pidió que desaparecieran). Vacío por defecto: sin
      # esta variable, no se excluye ningún expediente.
      EXCLUSION_EXPEDIENTES_PATH: ${EXCLUSION_EXPEDIENTES_PATH:-}
      # Bloque 3, sesión de comparación documento-vs-listado interno: filtro
      # por palabras del título del contrato (app/exclusion.py,
      # ExclusionPalabrasTitulo) -- mismo mecanismo y mismo alcance que
      # EXCLUSION_EXPEDIENTES_PATH de arriba (solo la API la lee, solo
      # esconde de GET /catalogo y el Excel), pero por texto libre del
      # título en vez de por código de expediente/departamento. Vacío por
      # defecto: sin esta variable, no se excluye ningún título.
      EXCLUSION_PALABRAS_TITULO_PATH: ${EXCLUSION_PALABRAS_TITULO_PATH:-}
      # Orígenes permitidos para CORS (app/config.py): el navegador llama a
      # esta API desde fuera de la red de Docker, en el origen donde corre
      # "web". Lista separada por comas si hace falta más de uno.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Bloque 3 (CONTEXTO.md sección 25): solo el worker decide cuándo lanzar
      # el ciclo programado, pero la API también lee estos dos valores para
      # que GET /mantenimiento/estado muestre la frecuencia real, no el
      # valor por defecto de app/config.py -- deben coincidir con los del
      # servicio "worker".
      MANTENIMIENTO_INTERVALO_SEGUNDOS: ${MANTENIMIENTO_INTERVALO_SEGUNDOS:-604800}
      MANTENIMIENTO_PROGRAMADO_ACTIVO: ${MANTENIMIENTO_PROGRAMADO_ACTIVO:-true}
      # Copias de seguridad automáticas (sesión 2026-09-06): mismo motivo
      # que las dos variables de arriba -- solo el worker decide cuándo
      # lanzar la copia, pero la API también las lee para que
      # GET /mantenimiento/copias/estado muestre la frecuencia real.
      BACKUP_INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
      BACKUP_ACTIVO: ${BACKUP_ACTIVO:-true}
    volumes:
      - documentos:/data/documentos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./engine
    # Mismo motivo que en "api": esperar a la base de datos dentro del
    # proceso, no depender del orden de arranque de docker-compose.
    command: sh -c "python -m app.esperar_bd && python -m app.worker"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adif}:${POSTGRES_PASSWORD:-adif}@postgres:5432/${POSTGRES_DB:-adif}
      DOCUMENT_STORAGE_PATH: /data/documentos
      WORKER_POLL_INTERVAL_SECONDS: 3
      # Etapa 5 de la cascada de extracción (CONTEXTO.md sección 6): el
      # worker es el único proceso que puede necesitar llamar al modelo.
      # Sin valor por defecto embebido a propósito -- depende del proveedor
      # de modelo elegido en cada despliegue, se rellena siempre desde .env.
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
      # Solo si MODEL_API_KEY es una clave ligada a identidad (ver
      # docstring de APIModelProvider).
      MODEL_WORKSPACE_ID: ${MODEL_WORKSPACE_ID:-}
      # Solo desarrollo (CachedModelProvider, ver app/config.py): bind mount
      # al host para no pagar la misma cabecera dos veces entre reinicios
      # del contenedor. Vacío en un despliegue real.
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-}
      # Ver comentario en el servicio "api": mismo cruce, el worker lo
      # rellena al terminar la extracción de cada expediente.
      CODIGOS_PROYECTO_PATH: ${CODIGOS_PROYECTO_PATH:-}
      # Bloque 2, descubrimiento por sindicación (CONTEXTO.md sección 24):
      # departamentos de ADIF que se dan de alta solos. "28510" por defecto
      # -- el único que usa el corpus de hoy. Lista separada por comas.
      SINDICACION_DEPARTAMENTOS_ADIF: ${SINDICACION_DEPARTAMENTOS_ADIF:-28510}
      # Bloque 3, ejecución programada (CONTEXTO.md sección 25): cada cuánto
      # se lanza el ciclo completo solo. Semanal por defecto; "false" en
      # MANTENIMIENTO_PROGRAMADO_ACTIVO lo desactiva sin tocar código.
      MANTENIMIENTO_INTERVALO_SEGUNDOS: ${MANTENIMIENTO_INTERVALO_SEGUNDOS:-604800}
      MANTENIMIENTO_PROGRAMADO_ACTIVO: ${MANTENIMIENTO_PROGRAMADO_ACTIVO:-true}
      # Copias de seguridad automáticas (sesión 2026-09-06): volcado
      # completo de la base de datos, diario por defecto -- ver
      # `app.mantenimiento.copia_seguridad`. BACKUP_DIR apunta al volumen
      # `copias_seguridad_bd` de abajo, distinto del de PostgreSQL, para que
      # perder ese volumen no se lleve las copias por delante.
      BACKUP_DIR: /backups
      BACKUP_INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
      BACKUP_ACTIVO: ${BACKUP_ACTIVO:-true}
      BACKUP_RETENCION: ${BACKUP_RETENCION:-14}
    volumes:
      - documentos:/data/documentos
      - ./engine/.cache_modelo_dev:/app/.cache_modelo_dev
      - copias_seguridad_bd:/backups
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  documentos:
  # Copias de seguridad automáticas (sesión 2026-09-06): volumen propio,
  # deliberadamente separado de `postgres_data` -- perder ese volumen no
  # debe llevarse las copias por delante. Ver `app.mantenimiento.copia_seguridad`
  # y "Copias de seguridad" en README.md.
  copias_seguridad_bd:
